{
  "concurrency": {
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}",
    "group": "${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}"
  },
  "jobs": {
    "check-darwin": {
      "needs": "get-check-names-darwin",
      "runs-on": "macos-latest",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "submodules": true
          }
        },
        {
          "uses": "DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af"
        },
        {
          "uses": "DeterminateSystems/flakehub-cache-action@88740a21e786360ba66bdd8fecabcbf852db3a5a"
        },
        {
          "run": "nix --accept-flake-config build '.#checks.aarch64-darwin.\"${{ matrix.checks }}\"'\n"
        }
      ],
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "checks": "${{ fromJson(needs.get-check-names-darwin.outputs.checks) }}"
        }
      }
    },
    "check-linux": {
      "needs": "get-check-names-linux",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "submodules": true
          }
        },
        {
          "uses": "wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874",
          "with": {
            "hatchet-protocol": "holster"
          }
        },
        {
          "uses": "DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af"
        },
        {
          "uses": "DeterminateSystems/flakehub-cache-action@88740a21e786360ba66bdd8fecabcbf852db3a5a"
        },
        {
          "run": "nix --accept-flake-config build '.#checks.x86_64-linux.\"${{ matrix.checks }}\"'\n"
        }
      ],
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "checks": "${{ fromJson(needs.get-check-names-linux.outputs.checks) }}"
        }
      }
    },
    "get-check-names-darwin": {
      "outputs": {
        "checks": "${{ steps.get-check-names.outputs.checks }}"
      },
      "runs-on": "macos-latest",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "submodules": true
          }
        },
        {
          "uses": "DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af"
        },
        {
          "uses": "DeterminateSystems/flakehub-cache-action@88740a21e786360ba66bdd8fecabcbf852db3a5a"
        },
        {
          "id": "get-check-names",
          "run": "checks=\"$(nix --accept-flake-config eval --json .#checks.aarch64-darwin --apply builtins.attrNames)\"\necho \"checks=$checks\" >> \"$GITHUB_OUTPUT\"\n"
        }
      ]
    },
    "get-check-names-linux": {
      "outputs": {
        "checks": "${{ steps.get-check-names.outputs.checks }}"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803",
          "with": {
            "persist-credentials": false,
            "submodules": true
          }
        },
        {
          "uses": "DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af"
        },
        {
          "uses": "DeterminateSystems/flakehub-cache-action@88740a21e786360ba66bdd8fecabcbf852db3a5a"
        },
        {
          "id": "get-check-names",
          "run": "checks=\"$(nix --accept-flake-config eval --json .#checks.x86_64-linux --apply builtins.attrNames)\"\necho \"checks=$checks\" >> \"$GITHUB_OUTPUT\"\n"
        }
      ]
    },
    "ready": {
      "if": "${{ always() }}",
      "name": "ready",
      "needs": [
        "get-check-names-linux",
        "get-check-names-darwin",
        "check-linux",
        "check-darwin"
      ],
      "permissions": {
        "contents": "none"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "env": {
            "NEEDS": "${{ toJSON(needs) }}"
          },
          "name": "Require every build job to succeed",
          "run": "printf '%s\\n' \"$NEEDS\" | jq -e 'length > 0 and all(.[]; .result == \"success\")'\n"
        }
      ]
    }
  },
  "name": "Check",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "master"
      ]
    },
    "workflow_call": {},
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "id-token": "write"
  }
}
