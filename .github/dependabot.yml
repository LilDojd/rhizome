{
  "updates": [
    {
      "commit-message": {
        "prefix": "chore(deps)"
      },
      "cooldown": {
        "default-days": 0
      },
      "directory": "/",
      "groups": {
        "nix-inputs": {
          "patterns": [
            "*"
          ]
        }
      },
      "labels": [
        "dependencies",
        "automated"
      ],
      "open-pull-requests-limit": 1,
      "package-ecosystem": "nix",
      "schedule": {
        "interval": "daily"
      }
    }
  ],
  "version": 2
}
